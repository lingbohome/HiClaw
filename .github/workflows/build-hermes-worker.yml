name: Build Hermes Worker Only

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Hermes Worker image tag'
        required: false
        default: 'latest'
      controller_version:
        description: 'Controller image tag to COPY CLI from'
        required: false
        default: 'latest'

env:
  REGISTRY: registry.cn-shanghai.aliyuncs.com
  REPO: lingbohome
  HIGRESS_REGISTRY: higress-registry.us-west-1.cr.aliyuncs.com

jobs:
  hermes-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (patch branch)
        uses: actions/checkout@v4
        with:
          ref: mvp-patch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push hermes-worker
        run: |
          WORKER_TAG="${{ github.event.inputs.version || 'latest' }}"
          CTRL_TAG="${{ github.event.inputs.controller_version || 'latest' }}"
          make push-hermes-worker \
            VERSION="${WORKER_TAG}" \
            REGISTRY=${{ env.REGISTRY }} \
            REPO=${{ env.REPO }} \
            MULTIARCH_PLATFORMS=linux/amd64 \
            HIGRESS_REGISTRY=${{ env.HIGRESS_REGISTRY }} \
            CONTROLLER_TAG=${{ env.REGISTRY }}/${{ env.REPO }}/hiclaw-controller:${CTRL_TAG} \
            DOCKER_BUILD_ARGS="--build-arg APT_MIRROR= --build-arg PIP_INDEX_URL=https://pypi.org/simple/"
